services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hero
      POSTGRES_PASSWORD: heroPass123
      POSTGRES_DB: heroes_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero -d heroes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
